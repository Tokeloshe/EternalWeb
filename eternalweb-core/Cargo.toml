[package]
name = "eternalweb-core"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Core library for EternalWeb - Decentralized web archiving platform"

[lib]
crate-type = ["rlib"]

[dependencies]
# Workspace dependencies
tokio = { workspace = true }
async-trait = { workspace = true }
libp2p = { workspace = true }
cid = { workspace = true }
multihash = { workspace = true }
multihash-codetable = { workspace = true }
ring = { workspace = true }
ed25519-dalek = { workspace = true }
x25519-dalek = { workspace = true }
zeroize = { workspace = true }
blake3 = { workspace = true }
rand = { workspace = true }
sled = { workspace = true }
tantivy = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
bincode = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
url = { workspace = true }
bytes = { workspace = true }
futures = { workspace = true }
parking_lot = { workspace = true }
dashmap = { workspace = true }
reqwest = { workspace = true }
scraper = { workspace = true }

# Additional specific dependencies
mime = "0.3"
hex = "0.4"

[dev-dependencies]
tempfile = { workspace = true }

[features]
default = ["full"]
full = ["archiving", "networking", "security", "search", "blockchain", "ai", "collaboration", "incentives"]
archiving = []
networking = []
security = []
search = []
blockchain = []
ai = []
collaboration = []
incentives = []
