[workspace]
members = [
    "eternalweb-core",
    "eternalweb-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
authors = ["EternalWeb Contributors"]
edition = "2021"
license = "AGPL-3.0"
repository = "https://github.com/e_honiball/eternalweb"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full"] }
async-trait = "0.1"

# Networking - libp2p
libp2p = { version = "0.53", features = ["tcp", "quic", "noise", "yamux", "gossipsub", "kad", "mdns", "request-response", "identify", "rendezvous", "relay", "dcutr", "upnp", "websocket"] }
libp2p-webrtc = "0.6"

# IPFS integration
rust-ipfs = "0.11"
cid = "0.11"
multihash = "0.19"

# Hypercore protocol
hypercore = "0.13"
hypercore-protocol = "0.2"

# Cryptography - Post-quantum ready
ring = "0.17"
kyber = "0.1"
dilithium = "0.1"
ed25519-dalek = "2.1"
x25519-dalek = "2.0"
zeroize = "1.7"

# Zero-knowledge proofs
ark-std = "0.4"
ark-ff = "0.4"
ark-ec = "0.4"

# Database
sled = "0.34"

# Search engine
tantivy = "0.21"

# Semantic/RDF support
sophia = "0.8"

# AI/ML - ONNX runtime
tract-onnx = "0.21"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
rmp-serde = "1.1"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Web framework (for API)
axum = "0.7"
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }

# WASM support
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Document", "HtmlElement"] }

# Blockchain - Substrate
sp-core = "28.0"
sp-runtime = "31.0"
substrate-build-script-utils = "11.0"

# Smart contracts
ink = "5.0"

# Utilities
uuid = { version = "1.6", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
url = "2.5"
bytes = "1.5"
futures = "0.3"
parking_lot = "0.12"
dashmap = "5.5"

# CLI
clap = { version = "4.4", features = ["derive", "env"] }
colored = "2.1"
indicatif = "0.17"

# Testing
proptest = "1.4"
criterion = "0.5"
mockall = "0.12"

# Security
seccompiler = "0.4"
