[workspace]
members = [
    "eternalweb-core",
    "eternalweb-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
authors = ["EternalWeb Contributors"]
edition = "2021"
license = "AGPL-3.0"
repository = "https://github.com/Tokeloshe/eternalweb"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full"] }
async-trait = "0.1"

# Networking - libp2p
libp2p = { version = "0.53", features = ["tcp", "noise", "yamux", "gossipsub", "kad", "mdns", "request-response", "identify"] }

# Content addressing
cid = { version = "0.11", features = ["serde-codec"] }
multihash = { version = "0.19", features = ["serde-codec"] }
multihash-codetable = { version = "0.1", features = ["blake3"] }

# Cryptography
ring = "0.17"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
x25519-dalek = "2.0"
zeroize = "1.7"
blake3 = "1.5"
rand = "0.8"

# Database
sled = "0.34"

# Search engine
tantivy = "0.22"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Web framework (for API)
axum = "0.7"
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }

# HTTP client
reqwest = { version = "0.11", features = ["json", "rustls-tls"] }

# HTML parsing
scraper = "0.18"

# Utilities
uuid = { version = "1.6", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
url = "2.5"
bytes = { version = "1.5", features = ["serde"] }
futures = "0.3"
parking_lot = "0.12"
dashmap = "5.5"

# CLI
clap = { version = "4.4", features = ["derive", "env"] }
colored = "2.1"
indicatif = "0.17"

# Testing
tempfile = "3.8"
